<title>Fraud Master</title>

<style>
html,body{max-width:100%;overflow-x:hidden}
:root{
  --pm-primary:#2563EB;--pm-primary-hover:#1D4ED8;--pm-primary-subtle:#EFF6FF;
  --pm-secondary:#7C3AED;
  --pm-surface-base:#f6f7f9;--pm-surface-raised:#ffffff;
  --pm-border-default:#dee2e6;--pm-border-subtle:#e9ecef;
  --pm-text-primary:#1a1d20;--pm-text-secondary:#495057;--pm-text-muted:#94a3b8;
  --pm-success:#10b981;--pm-warning:#f59e0b;--pm-danger:#dc3545;
  --pm-radius-control:8px;--pm-radius-container:16px;
  --pm-focus:color-mix(in srgb,#2563EB 35%,transparent);
}
*{box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--pm-surface-base);color:var(--pm-text-primary);margin:0}
.text-muted2{color:var(--pm-text-muted)}
.text-sec{color:var(--pm-text-secondary)}
.tnum{font-variant-numeric:tabular-nums}
a{color:var(--pm-primary)}
:where(button,a,select,input,[tabindex]):focus-visible{outline:2px solid var(--pm-focus);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

/* shell */
.app{display:flex;min-height:100vh}
.sidebar{width:216px;flex:0 0 216px;background:var(--pm-surface-raised);border-right:1px solid var(--pm-border-subtle);position:sticky;top:0;height:100vh;display:none;flex-direction:column}
@media (min-width:992px){.sidebar{display:flex}}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--pm-surface-raised);border-bottom:1px solid var(--pm-border-subtle);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand .logo{height:32px;width:32px;border-radius:8px;background:var(--pm-primary);display:flex;align-items:center;justify-content:center;color:#fff}
.navlabel{padding:0 8px 8px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--pm-text-muted)}
.navitem{width:100%;display:flex;align-items:center;gap:12px;height:36px;padding:0 12px;border:none;background:none;border-radius:8px;font-size:14px;font-weight:500;color:var(--pm-text-secondary);cursor:pointer;text-align:left}
.navitem:hover{background:#f1f5f9}
.navitem.active{background:var(--pm-primary-subtle);color:#1E40AF}
.navitem .ic{color:var(--pm-text-muted);display:flex}
.navitem.active .ic{color:var(--pm-primary)}

/* cards */
.card2{background:var(--pm-surface-raised);border:1px solid var(--pm-border-subtle);border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:20px}
.card2 .card2-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card2 .card2-title{font-size:14px;font-weight:600;color:#0f172a}

/* buttons */
.btnx{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:8px;padding:9px 14px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:background .12s,color .12s;line-height:1}
.btn-brand{background:var(--pm-primary);color:#fff}
.btn-brand:hover{background:var(--pm-primary-hover)}
.btn-soft{background:#fff;border-color:var(--pm-border-default);color:#334155}
.btn-soft:hover{background:#f8fafc}
.key-on{background:#ecfdf5;border-color:#10b981;color:#047857}
.key-on:hover{background:#d1fae5}
.btn-ghost{background:none;color:var(--pm-text-secondary)}
.btn-ghost:hover{background:#f1f5f9}
.btnx:disabled{opacity:.45;cursor:default}

/* chips + pills */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500}
.chip-slate{background:#f1f5f9;color:#475569}
.chip-emerald{background:#ecfdf5;color:#047857}
.chip-amber{background:#fffbeb;color:#b45309}
.chip-violet{background:#f5f3ff;color:#6d28d9}
.pill{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500}
.pill-on{background:#ecfdf5;color:#047857}.pill-off{background:#fffbeb;color:#b45309}.pill-ic{background:#ede9fe;color:#6d28d9}
.daybadge{display:inline-flex;border-radius:999px;padding:2px 8px;font-size:12px;font-weight:500}

/* icon chip */
.ichip{display:inline-flex;align-items:center;justify-content:center;height:36px;width:36px;border-radius:12px}
.ic-indigo{background:var(--pm-primary-subtle);color:var(--pm-primary)}
.ic-amber{background:#fffbeb;color:#d97706}
.ic-emerald{background:#ecfdf5;color:#059669}
.ic-sky{background:#f0f9ff;color:#0284c7}

/* kpi */
.kpi .kpi-label{margin-top:16px;font-size:14px;color:#64748b}
.kpi .kpi-value{margin-top:4px;font-size:26px;font-weight:600;letter-spacing:-.02em}
.kpi .kpi-sub{margin-top:4px;font-size:12px;color:var(--pm-text-muted)}

/* avatar */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;font-weight:600;flex:0 0 auto}

/* segment bar */
.seg{display:flex;gap:4px;height:16px;width:100%}
.seg>span{border-radius:4px;min-width:4px;cursor:pointer;transition:opacity .12s}
.seg:hover>span{opacity:.4}
.seg>span:hover{opacity:1}
#segtip{position:fixed;z-index:1000;background:#0f172a;color:#fff;font-size:12px;line-height:1.35;padding:6px 10px;border-radius:8px;pointer-events:none;display:none;transform:translate(-50%,-100%);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#segtip b{font-weight:600}

/* legend + rows */
.legrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:none;padding:0;width:100%;text-align:left;cursor:pointer}
.legrow .nm{font-size:14px;color:#475569}
.legrow:hover .nm{color:#0f172a}
.comp-toggle button{padding:4px 10px;font-size:13px}
.metric{white-space:nowrap}
.comp-card .v-pct{display:none}
.comp-card.mode-pct .v-val{display:none}
.comp-card.mode-pct .v-pct{display:inline}
.dot{height:10px;width:10px;border-radius:999px;flex:0 0 auto}
.listrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;width:100%;text-align:left;background:none;border:none;cursor:pointer}
.listrow:hover{background:#f8fafc}
.rowtitle{font-size:14px;font-weight:500;color:#1e293b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowsub{font-size:12px;color:var(--pm-text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divi>*+*{border-top:1px solid #f1f5f9}

/* coverage */
.track{position:relative;height:12px;border-radius:999px;background:#f1f5f9}
.track>.fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--pm-success)}
.track>.badge2{position:absolute;top:-30px;transform:translateX(-50%);background:#0f172a;color:#fff;font-size:12px;border-radius:6px;padding:3px 7px}
.cov-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.cov-pct{font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.cov-sub{font-size:12px;color:var(--pm-text-muted);margin-top:2px}

/* segmented control */
.seg-ctl{display:inline-flex;gap:4px;background:#f1f5f9;border-radius:8px;padding:4px}
.seg-ctl button{border:none;background:none;border-radius:4px;padding:5px 12px;font-size:14px;font-weight:500;color:#64748b;cursor:pointer}
.seg-ctl button.on{background:#fff;color:#0f172a;box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* chart wrap */
.chwrap{position:relative;width:100%}

/* links in findings */
.lnk{border:none;background:none;padding:0;color:#0f172a;font-weight:500;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;cursor:pointer}
.lnk:hover{color:var(--pm-primary)}

/* finding cards */
.finding{border-radius:12px;padding:12px;border:1px solid}
.f-amber{background:#fffbeb;border-color:#fde68a}
.f-indigo{background:var(--pm-primary-subtle);border-color:#bfdbfe}
.f-rose{background:#fff1f2;border-color:#fecdd3}

/* overlay/modal */
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,23,.5);backdrop-filter:blur(2px)}
.ov-card{width:100%;max-width:32rem;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.ov-wide{max-width:min(64rem,94vw)}
.txtbl td,.txtbl th{white-space:nowrap;vertical-align:middle}
.ov-pad{padding:24px}

/* chat */
.chat{background:#fff;border:1px solid var(--pm-border-subtle);border-radius:16px;display:flex;flex-direction:column;height:min(560px,78vh)}
@media(min-width:992px){.chat{height:min(680px,78vh)}}
.chat-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #f1f5f9}
.chat-body{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-foot{border-top:1px solid #f1f5f9;padding:12px}
.bub{max-width:85%;border-radius:16px;padding:10px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.bub-u{align-self:flex-end;background:var(--pm-primary);color:#fff}
.bub-a{align-self:flex-start;background:#f1f5f9;color:#1e293b}
.bub.md{white-space:normal}
.md-p{margin:0 0 8px}.md-p:last-child{margin-bottom:0}
.md-h{font-weight:600;margin:10px 0 4px;line-height:1.3}.md-h:first-child{margin-top:0}
.md-h1{font-size:16px}.md-h2{font-size:15px}.md-h3{font-size:14px}.md-h4{font-size:13px}
.bub.md ul.md-l,.bub.md ol.md-l{margin:4px 0 8px;padding-left:20px}
.bub.md ul.md-l li,.bub.md ol.md-l li{margin:2px 0}
.md-tw{overflow-x:auto;margin:6px 0;border-radius:8px}
.ask-callout{display:flex;gap:10px;align-items:flex-start;background:var(--pm-primary-subtle);border:1px solid #c7d2fe;border-left:3px solid var(--pm-primary);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.ask-callout .ac-ico{color:var(--pm-primary);display:flex;margin-top:1px}.ask-callout .ac-ico svg{width:18px;height:18px}
.ask-callout .ac-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--pm-primary)}
.ask-callout .ac-text{font-size:14px;color:#1e293b;margin-top:2px;font-style:italic;line-height:1.45;overflow-wrap:anywhere}
.ask-callout .ac-sub{font-size:12px;color:#64748b;margin-top:4px}
.attach-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 24px;background:#f8fafc;border-bottom:1px solid var(--pm-border-subtle);flex-wrap:wrap}
.attach-memo{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#92400e;white-space:nowrap}
.attach-memo svg{width:13px;height:13px;flex:none}
.web-disclaimer{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;line-height:1.45;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-bottom:10px}
.web-disclaimer svg{width:14px;height:14px;flex:none;margin-top:1px}
.upload-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-top:12px}
.upload-note svg{width:14px;height:14px;flex:none;margin-top:1px}
.filechip{display:inline-flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--pm-border-subtle);border-radius:8px;padding:6px 10px;font-size:13px;max-width:100%}
.filechip .fi{display:flex;color:#64748b}.filechip .fi svg{width:16px;height:16px}
.filechip .fn{font-weight:500;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.filechip .fs{color:#94a3b8;font-size:12px;white-space:nowrap}
.filechip .fx{border:none;background:transparent;color:#94a3b8;cursor:pointer;padding:0;display:flex;line-height:0}.filechip .fx svg{width:16px;height:16px}.filechip .fx:hover{color:#e11d48}
.ws-row{min-width:0}
.ws-row>[class*="col-"]{min-width:0}
.chat{min-width:0}.chat-body{min-width:0}
.bub{min-width:0}.bub.md{max-width:100%}
.bub.md .md-tw{max-width:100%;min-width:0}
.md-tbl{border-collapse:collapse;font-size:12.5px;width:100%}
.md-tbl th,.md-tbl td{border:1px solid var(--pm-border-subtle);padding:4px 8px;text-align:left;white-space:nowrap}
.md-tbl td[style*="right"],.md-tbl th[style*="right"]{font-variant-numeric:tabular-nums}
.md-tbl th{background:#f8fafc;font-weight:600}
.bub.md code{background:#e2e8f0;padding:1px 5px;border-radius:4px;font-size:12px}
.bub.md strong{font-weight:600}
.starter{display:block;width:100%;text-align:left;border:1px solid var(--pm-border-subtle);border-radius:8px;padding:8px 12px;font-size:14px;color:#334155;background:#fff;cursor:pointer;margin-top:8px}
.starter:hover{border-color:#bfdbfe;background:var(--pm-primary-subtle)}

/* report */
.report-page{background:#fff;border:1px solid var(--pm-border-subtle);border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:48px;min-height:60vh;outline:none}
.spin{width:18px;height:18px;border:2px solid #cbd5e1;border-top-color:var(--pm-primary);border-radius:999px;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--pm-border-default);border-radius:8px;padding:9px 12px;font-size:14px;color:#0f172a;outline:none;font-family:inherit}
input.inp:focus,select.inp:focus{border-color:var(--pm-primary);box-shadow:0 0 0 4px var(--pm-primary-subtle)}
.lbl{font-size:12px;font-weight:500;color:#475569}
@media print{.no-print{display:none!important}.report-page{box-shadow:none;border:none;padding:24px}.content{display:block}.app{display:block}}
.svgico{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.ai-spark{transform-origin:center;filter:drop-shadow(0 0 2px rgba(124,58,237,.45));animation:aiPulse 2.6s ease-in-out infinite}
@keyframes aiPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.16);opacity:1}}
.btn-ai-review{transition:box-shadow .18s ease,border-color .18s ease}
.btn-ai-review:hover{box-shadow:0 3px 12px rgba(124,58,237,.28);border-color:#c4b5fd}
/* ---- Fraud Master additions (same token system; new domain surfaces) ---- */
.pill-open{background:#eff6ff;color:#1d4ed8}.pill-cleared{background:#ecfdf5;color:#047857}.pill-confirmed{background:#fff1f2;color:#be123c}.pill-escalated{background:#f5f3ff;color:#6d28d9}
.band{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.band-high{background:#fff1f2;color:#be123c}.band-med{background:#fffbeb;color:#b45309}.band-low{background:#f1f5f9;color:#475569}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:28px;border-radius:8px;font-weight:600;font-size:14px}
.score-high{background:#fff1f2;color:#be123c}.score-med{background:#fffbeb;color:#b45309}.score-low{background:#f1f5f9;color:#475569}
.scorebig{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1}
.rcode{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;white-space:nowrap}
.rc-rule{background:#fff1f2;color:#be123c}.rc-pattern{background:#eff6ff;color:#1d4ed8}
.reason{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.reason+.reason{border-top:1px solid #f1f5f9}
.reason .rw{flex:0 0 auto;min-width:36px;text-align:right;font-weight:600;font-size:13px;color:#0f172a}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--pm-text-muted);font-weight:500;margin:0}.kv dd{margin:0;color:#1e293b}
.qtbl th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#64748b;font-weight:600;background:#f8fafc;white-space:nowrap}
.qtbl td{font-size:13px;vertical-align:middle;white-space:nowrap}
.qtbl tbody tr{cursor:pointer}.qtbl tbody tr:hover td{background:#f8fafc}
.qtbl .thb{border:none;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.decopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--pm-border-subtle);border-radius:12px;padding:10px 12px;cursor:pointer}
.decopt.on{border-color:var(--pm-primary);background:var(--pm-primary-subtle)}
.decopt input{margin-top:3px}
.guard{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45;color:#1e3a8a;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 10px}
.guard svg{width:14px;height:14px;flex:none;margin-top:1px}
.about h6{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--pm-primary);margin:20px 0 6px}
.about h6:first-child{margin-top:0}
.about p,.about li{font-size:14px;color:#334155;line-height:1.55}
.about ul{padding-left:18px;margin:4px 0 0}
.layer{border:1px solid var(--pm-border-subtle);border-radius:12px;padding:12px;height:100%}
.layer .lt{font-size:13px;font-weight:600;color:#0f172a}.layer .ld{font-size:12px;color:#64748b;margin-top:4px;line-height:1.45}
.flowstep{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:#334155;white-space:nowrap}
.flowstep .fs-box{border:1px solid var(--pm-border-default);border-radius:8px;padding:6px 10px;background:#fff}
.flowstep .fs-box.fm{border-color:var(--pm-primary);background:var(--pm-primary-subtle);color:#1e40af}
.w-tile-off{opacity:.55;cursor:not-allowed}
/* triage lane tiles (see pipeline block below for layout) */
/* checklist */
.chkrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.chkrow+.chkrow{border-top:1px solid #f1f5f9}
.chk{flex:0 0 auto;width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.chk svg{width:13px;height:13px}
.chk-ok{background:#ecfdf5;color:#047857}.chk-bad{background:#fff1f2;color:#be123c}
/* AI assessment card */
.ai-risklvl{font-size:16px;font-weight:800;letter-spacing:.02em}
.src-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px}
.src-tag svg{width:12px;height:12px}
.src-ai{background:#eef2ff;color:#4338ca}
.src-local{background:#f1f5f9;color:#64748b}
.ai-sig{border:1px solid #f1f5f9;border-radius:10px;padding:8px 10px;background:#fafafa}
.ai-sev{display:inline-flex;align-items:center;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.03em}
.ai-hist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;border-top:1px solid #f1f5f9;padding-top:10px}
.ai-hist-l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;font-weight:600}
.ai-hist-v{font-size:13px;color:#334155;margin-top:2px;line-height:1.4}
@media(max-width:520px){.ai-hist{grid-template-columns:1fr}}
.ai-dot{display:inline-block;width:6px;height:6px;border-radius:999px;margin-right:5px;vertical-align:middle}
.ai-dot-live{background:#4338ca}.ai-dot-local{background:#94a3b8}
/* rules & tuning */
.tune-tile{border:1px solid var(--pm-border-subtle);border-radius:12px;padding:12px 14px;height:100%}
.tune-l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;font-weight:600}
.tune-v{font-size:16px;font-weight:700;margin-top:4px;color:#0f172a}
.inp-sm{padding:4px 8px;font-size:13px}
.tsw{position:relative;display:inline-block;width:38px;height:22px;cursor:pointer;margin:0}
.tsw input{opacity:0;width:0;height:0;position:absolute}
.tsw span{position:absolute;inset:0;background:#cbd5e1;border-radius:999px;transition:.15s}
.tsw span:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.tsw input:checked+span{background:var(--pm-primary)}
.tsw input:checked+span:before{transform:translateX(16px)}
.tsw input:disabled+span{opacity:.5;cursor:not-allowed}
/* pipeline */
.pipe{display:flex;align-items:stretch;gap:12px}
.pipe-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.pipe-inbox,.pipe-outbox{flex:0 0 clamp(170px,20%,240px);min-width:0}
.pipe-lanes{flex:1 1 auto;min-width:0}
.pipe-cap{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:#94a3b8}
.pipe-lane-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1}
.pipe-arrow{display:flex;align-items:center;color:#cbd5e1;flex:0 0 auto;padding-top:22px}
.pipe-arrow svg{width:20px;height:20px}
.lane-tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--pm-surface-raised);border:1px solid var(--pm-border-subtle);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05);height:100%;min-width:0}
.lane-tile:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.lane-tile.on{border-color:var(--pm-primary);box-shadow:0 0 0 1px var(--pm-primary)}
.lane-stage{background:linear-gradient(180deg,#f5f3ff,#fff);border-color:#ddd6fe}
.lane-stage.on{border-color:#6366f1;box-shadow:0 0 0 1px #6366f1}
.lane-done{background:#f8fafc}
.lane-top{display:flex;align-items:center;gap:8px;min-width:0}
.lane-dot{width:10px;height:10px;border-radius:999px;flex:0 0 auto}
.lane-label{font-size:14px;font-weight:600;color:#0f172a;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-count{margin-left:auto;font-size:22px;font-weight:700;letter-spacing:-.02em;color:#0f172a;flex:0 0 auto}
.lane-sub{font-size:12px;color:var(--pm-text-muted);line-height:1.4;min-height:32px}
.lane-amt{font-size:12px;color:#64748b;font-weight:500}
/* mid widths (tablet / narrow desktop / artifact preview): stack the pipeline vertically,
   drop the horizontal arrows, and let the three disposition lanes wrap 3-up then 2-up */
@media(max-width:1200px){
  .pipe{flex-direction:column}
  .pipe-arrow{display:none}
  .pipe-inbox,.pipe-outbox,.pipe-lanes{flex:1 1 auto}
  .pipe-inbox .lane-tile,.pipe-outbox .lane-tile{flex-direction:row;align-items:center;flex-wrap:wrap;gap:4px 12px}
  .pipe-inbox .lane-sub,.pipe-outbox .lane-sub{min-height:0;flex:1 1 100%;order:3}
  .pipe-inbox .lane-amt,.pipe-outbox .lane-amt{order:2;margin-left:auto}
}
@media(max-width:760px){.pipe-lane-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.pipe-lane-grid{grid-template-columns:1fr}}

   out.push('<div class="md-tw"><table class="md-tbl"><thead>'+th+'</thead><tbody>'+tb+'</tbody></table></div>');continue;
  }
  var h=line.match(/^\s*(#{1,4})\s+(.*)$/);

 }
 return out.join('')||'<p class="md-p"></p>';
}

/* Pipeline: raw data -> Run analysis (context -> LLM or local fallback -> assessment) -> lane -> Decided.
   A credit enters the lanes only after a run assesses it (state.assessments[id] set, id in state.loaded).
   The assessment's recommended_queue drives the lane; deterministic hard-stops force Investigate. */
const STP_MAX=12;
const STRUCTURING=new Set(["DUP","SPLIT"]);

 const a=assessmentOf(r);
 if(a&&a.lane)return a.lane;              /* AI or local assessment routes it */
 /* pre-assessment fallback (should not normally happen once loaded) */
 if(r.band==="high"||hasStructuring(r))return "investigate";
 if(r.band==="med"||hasRule(r)||r.reasons.length)return "review";
 return "stp";
}
function stageOf(r){
 if(statusOf(r)!=="Open")return "done";
 return routeLane(r);
}

];

function shownScore(r){const a=assessmentOf(r);return a&&Number.isFinite(a.ai_risk_score)?a.ai_risk_score:r.score;}

function generateData(seed=20260904,count=620){

 /* near-duplicate pairs: same customer + nature, amount within 2%, 3 to 12 days apart, different invoice ref */

 for(let k=0;k<5;k++){const cust=pick(rng,GT_CUSTOMERS.concat(MT_CUSTOMERS));const nat=pick(rng,NATURES);const amt=Math.round(nat[4]*(3.5+rng()*2.5)/1000)*1000;rows.push(mkCM(rng,{customer:cust,nature:nat,channel:GT_CUSTOMERS.includes(cust)?"General Trade":"MT National Chains",amount:amt,approver:APPROVERS.find(a=>a[1]>=amt)||APPROVERS[4],ms:now-Math.floor(rng()*340)*DAY,planted:"amt"}));}

 for(let k=0;k<5;k++){const ms=now-Math.floor(rng()*340)*DAY;rows.push(mkCM(rng,{ms,nature:pick(rng,NATURES.slice(1,5)),pawFrom:ms+(3+Math.floor(rng()*14))*DAY,pawTo:ms+60*DAY,planted:"advance"}));}
 for(let k=0;k<5;k++)rows.push(mkCM(rng,{ms:now-Math.floor(rng()*340)*DAY,ioStatus:"Closed",hour:k<2?22:undefined,planted:"io"}));
 for(let k=0;k<4;k++){const req=pick(rng,REQUESTERS);rows.push(mkCM(rng,{ms:now-Math.floor(rng()*340)*DAY,requester:req,approver:[req,250000],amount:Math.round((60000+rng()*150000)/1000)*1000,planted:"sod"}));}
 for(let k=0;k<6;k++)rows.push(mkCM(rng,{ms:now-Math.floor(rng()*340)*DAY,attProv:1+Math.floor(rng()*2),planted:"att"}));
 for(let k=0;k<3;k++){const ap=pick(rng,APPROVERS.slice(0,3));rows.push(mkCM(rng,{ms:now-Math.floor(rng()*340)*DAY,approver:ap,amount:Math.round(ap[1]*(1.05+rng()*0.4)/1000)*1000,planted:"over"}));}
 for(let k=0;k<12;k++){const d=new Date(now-Math.floor(rng()*11)*30*DAY);const eom=endOfMonth(d);const t=new Date(d.getFullYear(),d.getMonth(),eom-(rng()<0.5?0:1),10).getTime();if(t<now)rows.push(mkCM(rng,{ms:t,planted:"period"}));}

}
const sum=(arr,f)=>arr.reduce((s,x)=>s+f(x),0);
function groupSum(rows,key){const m={};for(const r of rows)m[r[key]]=(m[r[key]]||0)+r.amount;return Object.entries(m).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);}
function groupCount(rows,key){const m={};for(const r of rows)m[r[key]]=(m[r[key]]||0)+1;return Object.entries(m).map(([name,n])=>({name,n})).sort((a,b)=>b.n-a.n);}
const median=(a)=>{if(!a.length)return 0;const s=a.slice().sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;};

/* ---------------- scoring engine (local, deterministic, explainable) ----------------
   Layer 1 rules and Layer 2 pattern analytics run here in the browser over the full dataset.
   The LLM never scores. It only explains, summarises, and answers questions over authorized rows. */
function scoreAll(rows){
 const byCust={};rows.forEach(r=>(byCust[r.customer]||(byCust[r.customer]=[])).push(r));
 for(const r of rows){r.reasons=[];r.related=new Set();
  const add=(code,evidence,rel)=>{r.reasons.push({code,evidence});if(rel)rel.forEach(x=>{if(x.id!==r.id)r.related.add(x.id);});};
  const d=new Date(r.ms);
  if(r.requester===r.approver)add("SOD",r.requester+" both requested and approved this credit.");
  if(r.amount>r.limit)add("OVER_LIMIT",peso(r.amount)+" exceeds "+r.approver+"'s limit of "+peso(r.limit)+".");
  if(r.paw&&r.date>r.paw.to)add("PAW_EXP",r.paw.id+" ended "+r.paw.to+"; credit posted "+r.date+".");
  if(r.paw&&r.date<r.paw.from)add("PAW_ADV",r.paw.id+" activity starts "+r.paw.from+"; credit posted "+r.date+", before execution.");
  if(r.io.status==="Closed")add("IO_CLOSED",r.io.id+" is closed; the credit still charged to it.");
  if(r.attProv<r.attReq)add("ATT_MISS",r.attProv+" of "+r.attReq+" mandatory attachments on file.");
  const mine=byCust[r.customer]||[];
  const dups=mine.filter(x=>x.id!==r.id&&x.nature===r.nature&&Math.abs(x.amount-r.amount)/r.amount<=0.01&&Math.abs(x.ms-r.ms)<=10*DAY);
  if(dups.length)add("DUP",dups.map(x=>x.id+" ("+peso(x.amount)+", "+x.date+", "+x.invoice+")").join("; ")+" for the same customer and nature.",dups);
  const near=mine.filter(x=>x.id!==r.id&&x.requester===r.requester&&x.approver===r.approver&&Math.abs(x.ms-r.ms)<=7*DAY&&x.amount>=0.8*x.limit&&x.amount<x.limit);
  if(r.amount>=0.8*r.limit&&r.amount<r.limit&&near.length>=2){const grp=near.concat([r]);const tot=sum(grp,x=>x.amount);if(tot>r.limit)add("SPLIT",grp.length+" credits by "+r.requester+" within 7 days, each under "+peso(r.limit)+", totalling "+peso(tot)+".",near);}
  const win=mine.filter(x=>Math.abs(x.ms-r.ms)<=15*DAY);const pace=Math.max(1,mine.length/12);const fthr=Math.max(5,Math.ceil(pace*2.5));
  if(win.length>=fthr)add("FREQ",win.length+" credits to "+r.customer+" within 30 days, against a usual pace of about "+pace.toFixed(1)+" per month.",win);
  const others=mine.filter(x=>x.id!==r.id).map(x=>x.amount);
  if(others.length>=4){const md=median(others);if(md>0&&r.amount>=3*md)add("AMT",peso(r.amount)+" is "+(r.amount/md).toFixed(1)+"x this customer's median credit of "+peso(md)+".");}
  const eom=endOfMonth(d);if(d.getDate()>=eom-1)add("PERIOD","Posted "+r.date+", within two days of month-end.");
  if(r.hour<7||r.hour>19)add("HOURS","Posted at "+String(r.hour).padStart(2,"0")+":00, outside 07:00 to 19:00.");
  r.reasons=r.reasons.filter(x=>RULE_ENABLED(x.code)); /* disabled rules do not contribute */
  r.reasons.sort((a,b)=>RULE_W(b.code)-RULE_W(a.code));
  r.score=Math.min(100,sum(r.reasons,x=>RULE_W(x.code)));

}
const hasRule=(r)=>r.reasons.some(x=>RC[x.code].type==="rule");
const hasPattern=(r)=>r.reasons.some(x=>RC[x.code].type==="pattern");

/* ================= CONTEXT BUILDER =================
   Per-case behavioral profile sent to the LLM. Derives statistics (not raw dumps):
   the customer's own baseline, this credit's deviation, related cross-transaction facts,
   and the deterministic control findings as structured evidence. */
/* hard-stop membership is dynamic via RULE_HARD (editable in Rules & Tuning) */
const HARD_STOP_CODES={has:(code)=>RULE_HARD(code)};
function customerBaseline(cust,allRows){

 const md=median(amts), avg=amts.length?Math.round(sum(mine,r=>r.amount)/amts.length):0;
 const lo=amts.length?amts[Math.floor(amts.length*0.05)]:0, hi=amts.length?amts[Math.floor(amts.length*0.95)]:0;

}
function buildCaseContext(r,allRows){

 const related=(r.related||[]).map(id=>allRows.find(x=>x.id===id)).filter(Boolean);
 const relatedTotal=sum(related,x=>x.amount)+r.amount;
 const controlHits=r.reasons.filter(x=>RC[x.code].type==="rule").map(x=>({code:x.code,label:RC[x.code].label,evidence:x.evidence,hard_stop:RULE_HARD(x.code)}));
 const patternHits=r.reasons.filter(x=>RC[x.code].type==="pattern").map(x=>({code:x.code,label:RC[x.code].label,evidence:x.evidence}));
 const dfm=Math.min(r.date.slice(8)-0, endOfMonth(new Date(r.ms))-(r.date.slice(8)-0));

  case_id:r.id,
  current_transaction:{
   transaction_type:"Credit Memo", nature:r.nature, channel:r.channel, business_unit:r.bu,
   customer:r.customer, requester:r.requester, approver:r.approver, approval_limit:r.limit,
   amount:r.amount, posted_date:r.date, posted_hour:r.hour,
   invoice_dm:r.invoice, internal_order:r.io.id, io_status:r.io.status,
   paw:r.paw?{id:r.paw.id,from:r.paw.from,to:r.paw.to}:null,
   attachments:{provided:r.attProv,required:r.attReq},
   prior_intervention:r.intervention||null

  customer_baseline:{

   ratio_to_median:base.median?+(r.amount/base.median).toFixed(2):null,
   credits_last_7d:win(7), credits_last_30d:win(30), credits_last_90d:win(90)
  },
  cross_transaction:{
   related_credit_ids:related.map(x=>x.id),
   related_count:related.length,
   related_combined_amount:relatedTotal,
   related_exceeds_limit:relatedTotal>r.limit,
   days_from_month_end:dfm
  },
  deterministic_controls:controlHits,
  behavioral_signals:patternHits,
  policy_context:"AR Credit Memo deduction. Prerequisites: valid promo approval/IO, within approval limit, segregation of duties, complete attachments."

/* ================= LOCAL MASKING (DLP) =================
   Replaces identifiers with stable aliases before context leaves the browser; keeps a local
   map for rehydration. Business terms and amounts are never masked. */
const maskMap={fwd:{},rev:{},seq:{customer:0,requester:0,approver:0,cm:0,invoice:0,io:0}};
function alias(kind,val){
 if(!val)return val;const key=kind+"::"+val;
 if(maskMap.fwd[key])return maskMap.fwd[key];
 maskMap.seq[kind]=(maskMap.seq[kind]||0)+1;
 const pfx={customer:"CUSTOMER",requester:"USER",approver:"USER",cm:"CM",invoice:"INV",io:"IO"}[kind]||"REF";
 const a=pfx+"_"+String(maskMap.seq[kind]).padStart(3,"0");
 maskMap.fwd[key]=a;maskMap.rev[a]=val;return a;
}
function maskContext(ctx){
 const c=JSON.parse(JSON.stringify(ctx));
 c.case_id=alias("cm",ctx.case_id);
 const t=c.current_transaction;
 t.customer=alias("customer",t.customer);t.requester=alias("requester",t.requester);t.approver=alias("approver",t.approver);
 t.invoice_dm=alias("invoice",t.invoice_dm);t.internal_order=alias("io",t.internal_order);
 if(c.cross_transaction)c.cross_transaction.related_credit_ids=(c.cross_transaction.related_credit_ids||[]).map(id=>alias("cm",id));
 /* evidence strings can carry names/ids; alias the known ones we mapped */
 const scrub=(s)=>{let out=String(s||"");Object.keys(maskMap.rev).forEach(a=>{const real=maskMap.rev[a];if(real&&out.includes(real))out=out.split(real).join(a);});return out;};
 (c.deterministic_controls||[]).forEach(h=>h.evidence=scrub(h.evidence));
 (c.behavioral_signals||[]).forEach(h=>h.evidence=scrub(h.evidence));

}
function rehydrate(text){ /* turn aliases back into real identifiers for display */
 let out=String(text||"");Object.keys(maskMap.rev).forEach(a=>{if(out.includes(a))out=out.split(a).join(maskMap.rev[a]);});return out;
}
function rehydrateAssessment(a){
 if(!a)return a;const c=JSON.parse(JSON.stringify(a));
 c.case_id=rehydrate(c.case_id);
 if(c.behavioral_assessment)c.behavioral_assessment.summary=rehydrate(c.behavioral_assessment.summary);
 (c.signals||[]).forEach(s=>{s.description=rehydrate(s.description);s.supporting_evidence=(s.supporting_evidence||[]).map(rehydrate);});
 if(c.historical_context){c.historical_context.normal_behavior=rehydrate(c.historical_context.normal_behavior);c.historical_context.observed_deviation=rehydrate(c.historical_context.observed_deviation);}
 c.reasoning_summary=rehydrate(c.reasoning_summary);
 c.reviewer_focus=(c.reviewer_focus||[]).map(rehydrate);
 return c;
}

/* ================= AI ASSESSMENT (Stage 3 + 4) =================
   analyzeCase() sends the (optionally masked) context to /api/analyze and returns a validated,
   rehydrated assessment. If no provider / failure / invalid, returns a LOCAL fallback assessment
   in the same schema. Deterministic hard-stops override the queue to Investigate either way. */
let AI={provider:"",model:"",live:false};                 /* set from /api/health */
const AIMODE={masking:true, forceLocal:false, deployment:"cloud"}; /* deployment: cloud|platform|hybrid|onprem */
function maskingDefaultFor(dep){return dep!=="onprem";}    /* ON unless genuinely on-prem */
const LEVEL_FROM_BAND={high:"HIGH",med:"MEDIUM",low:"LOW"};
const QUEUE_FROM_LEVEL={HIGH:"INVESTIGATE",MEDIUM:"REVIEW",LOW:"STRAIGHT_THROUGH"};

const STRICTNESS={lenient:{inv:80,rev:55},balanced:{inv:70,rev:45},strict:{inv:60,rev:35}};

function localAssessment(r,allRows){

 const score=r.score, level=levelForScore(score);

  case_id:r.id, risk_level:level, ai_risk_score:score, recommended_queue:QUEUE_FROM_LEVEL[level], confidence:0.55,
  behavioral_assessment:{is_unusual:score>=STRICTNESS[strictness].rev, summary:r.reasons.length?("Fired "+r.reasons.length+" signal(s); "+(topReason(r).toLowerCase())+"."):"No control or pattern fired."},
  signals:sigs,
  historical_context:{normal_behavior:cb.historical_transactions+" prior credits, median "+peso(cb.median_amount)+", ~"+cb.normal_monthly_pace+"/mo", observed_deviation:dev},
  reasoning_summary:r.reasons.length?("Prioritized by deterministic rules and cross-transaction patterns. "+(ctx.cross_transaction.related_exceeds_limit?"Related credits combine over the approval limit. ":"")):"Clean; no signals.",
  reviewer_focus:r.reasons.slice(0,3).map(x=>"Check: "+RC[x.code].label.toLowerCase()),

}
async function analyzeCase(r,allRows,opts){
 const ctx=buildCaseContext(r,allRows);

  const a=localAssessment(r,allRows);
  return finalizeAssessment(a,hardStop,"local",null);
 }

 const payloadCtx=masked?maskContext(ctx):ctx;

  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),60000);
  const res=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({case_id:r.id,masked,context:payloadCtx}),signal:ctrl.signal});
  clearTimeout(to);
  const data=await res.json();
  if(data.status==="ok"&&data.assessment){
   const a=masked?rehydrateAssessment(data.assessment):data.assessment;
   a._source="ai";a._audit=data.audit;
   return finalizeAssessment(a,hardStop,"ai",data.audit);
  }

  const a=localAssessment(r,allRows);a._fallbackReason=(data.status==="unavailable")?(data.reason||"AI unavailable"):"no live provider";

function freqCustomers(rows){const m={};rows.filter(r=>r.reasons.some(x=>x.code==="FREQ")).forEach(r=>{const s=(m[r.customer]||(m[r.customer]={customer:r.customer,n:0,amount:0}));s.n++;s.amount+=r.amount;});return Object.values(m).sort((a,b)=>b.n-a.n);}
function repeatCustomers(rows){const m={};rows.forEach(r=>{const s=(m[r.customer]||(m[r.customer]={name:r.customer,n:0,amount:0,high:0,flagged:0}));s.n++;s.amount+=r.amount;if(r.band==="high")s.high++;if(r.score>=30)s.flagged+=r.amount;});return Object.values(m).sort((a,b)=>b.flagged-a.flagged||b.n-a.n);}

async function completeWithFallback(system,messages,web){

  const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),60000);

   clearTimeout(to);
   const data=await res.json();
   if(!res.ok||data.type==="error"||!Array.isArray(data.content))throw new Error((data&&data.error&&data.error.message)||("Request failed ("+res.status+")"));

 try{var p=JSON.parse(clean);if(p&&Array.isArray(p.findings))return p.findings;if(Array.isArray(p))return p.filter(function(o){return o&&o.title&&o.detail;});}catch(e){}

 if(fm){try{var q=JSON.parse("{"+fm[0]+"}");if(q&&Array.isArray(q.findings))return q.findings;}catch(e){}}
 var out=[];var re=/\{[^{}]*"detail"[^{}]*\}/g;var m;

function localAnalysis(rows,picked){

 if(picked.includes("split")){const sc=splitClusters(rows);if(sc.length)findings.push({area:"splitting",title:"Sub-limit clusters over the approval limit",severity:"high",detail:sc.slice(0,3).map(s=>s.n+" credits to "+s.customer+" by "+s.requester+" ("+s.from+" to "+s.to+") each under "+money(s.limit)+" but totalling "+money(s.total)).join("; ")+". Individually compliant, collectively above the limit; worth a single combined approval review.",metric:sc.length+" clusters"});else findings.push({area:"splitting",title:"Sub-limit clusters",severity:"low",detail:"No group of same-requester credits inside 7 days summed over its approval limit in this window.",metric:"0 clusters"});}
 if(picked.includes("beh")){const fq=freqCustomers(rows);const am=rows.filter(r=>r.reasons.some(x=>x.code==="AMT")).sort((a,b)=>b.amount-a.amount);const parts=[];if(fq.length)parts.push(fq.slice(0,2).map(f=>f.customer+" received "+f.n+" credits in a 30-day spike").join("; "));if(am.length)parts.push(am.slice(0,2).map(r=>r.id+" for "+r.customer+" is "+money(r.amount)+", well above the customer's median").join("; "));
  findings.push({area:"behavior",title:"Unusual frequency and amounts",severity:(fq.length||am.length)?"medium":"low",detail:parts.length?parts.join(". ")+". Frequency and size outliers are where a one-transaction-at-a-time review is weakest.":"Credit frequency and amounts look consistent with each customer's usual pattern.",metric:(fq.length+am.length)+" signals"});}
 if(picked.includes("rules")){const rs=reasonStats(rows).filter(s=>RC[s.code].type==="rule");const n=rows.filter(hasRule).length;if(n)findings.push({area:"rules",title:"Control hits that should have stopped at the gate",severity:n>=8?"high":"medium",detail:n+" credits carry a deterministic control hit: "+rs.slice(0,4).map(s=>RC[s.code].label.toLowerCase()+" ("+s.n+")").join(", ")+". These are rule checks, not AI; they belong in the eRFCM entry gate and posting gate.",metric:n+" credits"});else findings.push({area:"rules",title:"Control hits",severity:"low",detail:"No deterministic control rule fired in this window.",metric:"0"});}

 return{findings,model:"computed locally"};
}

/* ---------------- RUN ANALYSIS modal ---------------- */
const RUN_WINDOWS=[[30,"Last 30 days","Recent postings"],[60,"Last 60 days","Short-term trend"],[90,"Last 90 days","This quarter"],[180,"Last 6 months","Half-year sweep"],["all","All time","Everything on record"]];
const RUN_MSGS=["Pulling the authorized credit memos","Applying control rules","Scoring cross-transaction patterns","Grouping duplicates and split clusters","Routing into lanes"];
let runState={step:0,win:"all",custom:"",customMode:false,progress:0,msg:0};
let runToken=0;
function openRun(){runState={step:0,win:"all",custom:"",customMode:false,progress:0,msg:0};renderRun();}
function runFiltered(){const rows=scopedRows();let days=runState.customMode?(+runState.custom||0):runState.win;if(days==="all")return rows;const cut=Date.now()-days*DAY;return rows.filter(r=>r.ms>=cut);}
function runLabel(){return runState.customMode?("last "+(+runState.custom||0)+" days"):(runState.win==="all"?"all time":RUN_WINDOWS.find(w=>w[0]===runState.win)[1].toLowerCase());}
const RUN_STAGES=["Loading authorized transactions","Building historical behavioral context","Checking deterministic controls","Preparing AI assessment","Applying data protection / masking","Sending to preferred LLM","Receiving AI risk assessments","Validating responses","Routing cases","Analysis complete"];
function renderRun(){
 const ds=dataScopeLabel(role());
 const modeLine=AI.live?`Live AI assessment via ${esc(AI.provider)}${AI.model?" ("+esc(AI.model)+")":""}`:"Local demo / fallback assessment (no live model configured)";
 let inner="";
 if(runState.step===0){
  inner=`<h5 style="font-weight:600;margin:0">Which credit memos should I assess?</h5><p class="text-sec" style="font-size:14px;margin-top:8px">Pick the historical range. Fraud Master prepares the behavioral context for each case (${esc(ds)}), the preferred LLM assesses whether the behavior looks unusual, and the cases route into the lanes. The reviewer makes the final decision.</p>
   <div class="d-flex align-items-center gap-2 mt-2 mb-1" style="font-size:12px"><span class="dot" style="background:${AI.live?"#10b981":"#94a3b8"}"></span><span class="text-sec">${modeLine}</span></div>
   <div class="row g-2 mt-1">${RUN_WINDOWS.map(w=>{const on=!runState.customMode&&runState.win===w[0];return `<div class="col-6"><button class="w-100 text-start" data-action="run-win" data-win="${w[0]}" style="border:1px solid ${on?"var(--pm-primary)":"var(--pm-border-subtle)"};background:${on?"var(--pm-primary-subtle)":"#fff"};border-radius:12px;padding:12px"><div style="font-size:14px;font-weight:500">${w[1]}</div><div class="text-muted2" style="font-size:12px;margin-top:4px">${w[2]}</div></button></div>`;}).join("")}
    <div class="col-12"><button class="w-100 text-start" data-action="run-custom" style="border:1px solid ${runState.customMode?"var(--pm-primary)":"var(--pm-border-subtle)"};background:${runState.customMode?"var(--pm-primary-subtle)":"#fff"};border-radius:12px;padding:12px"><div style="font-size:14px;font-weight:500">Custom range</div><div class="text-muted2" style="font-size:12px;margin-top:4px">Choose your own number of days</div></button>${runState.customMode?`<div class="d-flex align-items-center gap-2 mt-2"><input class="inp" id="run-days" type="number" min="1" value="${escA(runState.custom)}" placeholder="e.g. 45" style="width:112px"><span class="text-sec" style="font-size:14px">days back</span></div>`:""}</div>
   </div>
   <div class="d-flex align-items-center justify-content-between mt-4"><div class="text-muted2" style="font-size:12px">${runFiltered().length.toLocaleString()} credits in range</div><button class="btnx btn-brand" data-action="run-go">${IC.sparkles} Analyze data</button></div>`;
 }else{
  const st=runState.stage||0;
  const list=RUN_STAGES.map((label,i)=>{
   const done=i<st, active=i===st;
   const icon=done?`<span style="color:#10b981;display:inline-flex">${IC.check}</span>`:active?`<span class="spin" style="width:14px;height:14px;border-width:2px"></span>`:`<span style="width:14px;height:14px;border-radius:999px;border:2px solid #e2e8f0;display:inline-block"></span>`;
   const skip=(!AI.live||AIMODE.forceLocal)&&(i===4||i===5||i===6);
   return `<div class="d-flex align-items-center gap-2" style="padding:3px 0;opacity:${skip?0.4:(i<=st?1:0.5)}"><span style="width:16px;display:inline-flex;justify-content:center">${icon}</span><span style="font-size:13px;color:${active?"#0f172a":"#475569"};font-weight:${active?600:400}">${label}${skip?" (skipped, local mode)":""}</span></div>`;
  }).join("");
  inner=`<div style="padding:6px 2px"><div style="height:8px;background:#f1f5f9;border-radius:999px;overflow:hidden;margin-bottom:16px"><div style="height:100%;background:var(--pm-primary);width:${runState.progress}%;transition:width .2s"></div></div>${list}<div class="text-muted2 mt-2" style="font-size:12px">${Math.round(runState.progress)}% \u00b7 ${runFiltered().length.toLocaleString()} credits \u00b7 ${AI.live&&!AIMODE.forceLocal?"live assessment":"local assessment"}</div></div>`;
 }
 const stepTxt=runState.step===0?"Choose the range":"Analyzing";
 openModal(`<div class="ov-pad"><div class="d-flex align-items-center gap-3 mb-3"><span class="ichip ic-indigo" style="background:var(--pm-primary);color:#fff">${IC.sparkles}</span><div style="flex:1"><div style="font-size:14px;font-weight:600">Analyze data</div><div class="text-muted2" style="font-size:12px">${stepTxt} \u00b7 ${esc(ds)}</div></div>${runState.step===0?`<button class="btnx btn-ghost" data-action="close-modal" style="padding:4px">${IC.x}</button>`:""}</div>${inner}</div>`);
}
async function runGo(){
 const token=++runToken;runState.step=1;runState.progress=4;runState.stage=0;renderRun();
 const filtered=runFiltered();const days=runState.customMode?(+runState.custom||0):runState.win;const label=runLabel();
 const setStage=(i,pct)=>{if(token!==runToken)return;runState.stage=i;runState.progress=pct;renderRun();};
 /* Stage 1-3: load + build context + controls (already computed at scoreAll; we surface the steps) */
 setStage(0,8); await sleep(180);
 setStage(1,18); await sleep(200);
 setStage(2,26); await sleep(180);
 setStage(3,34); await sleep(150);
 /* Stage 4-8: per-case AI (or local) assessment. Cap live calls for the demo to stay in rate limits. */
 const openCases=filtered.filter(r=>statusOf(r)==="Open");
 const CAP=AI.live&&!AIMODE.forceLocal?24:openCases.length; /* live: assess the top-risk subset, rest local */
 const ordered=openCases.slice().sort((a,b)=>b.score-a.score);
 setStage(4,42); await sleep(150);
 if(AI.live&&!AIMODE.forceLocal){setStage(5,50);await sleep(120);}
 let done=0;const totalToDo=ordered.length;
 for(let i=0;i<ordered.length;i++){
  if(token!==runToken)return;
  const r=ordered[i];
  const useLive=AI.live&&!AIMODE.forceLocal&&i<CAP;
  const a=useLive?await analyzeCase(r,state.rows):finalizeAssessment(localAssessment(r,state.rows),buildCaseContext(r,state.rows).deterministic_controls.some(h=>h.hard_stop),"local",null);
  state.assessments[r.id]=a;
  done++;
  if(done%6===0||done===totalToDo){setStage(useLive?6:4, 50+Math.round(40*done/Math.max(1,totalToDo)));await sleep(0);}
 }
 setStage(7,92); await sleep(160);   /* validating */
 setStage(8,97); await sleep(160);   /* routing */
 if(token!==runToken)return;
 /* replace this scope's open loaded set with the range; keep decided credits loaded (Decided persists) */
 const scopeIds=new Set(scopedRows().map(r=>r.id));
 state.loaded.forEach(id=>{if(scopeIds.has(id)&&statusOf({id})==="Open")state.loaded.delete(id);});
 filtered.forEach(r=>state.loaded.add(r.id));
 const liveN=Object.values(state.assessments).filter(a=>a&&a.source==="ai").length;
 const anyLive=AI.live&&!AIMODE.forceLocal&&CAP>0;
 state.run={label,days,count:filtered.length,total:sum(filtered,r=>r.amount),at:new Date().toLocaleString("en-PH",{dateStyle:"medium",timeStyle:"short"}),mode:anyLive?"ai":"local",provider:AI.provider,model:AI.model,liveAssessed:anyLive?Math.min(CAP,totalToDo):0};
 setStage(9,100); await sleep(250);
 closeModal();state.view="queue";state.qfilter={lane:"investigate",reason:"all",q:""};state.qlimit=25;render();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function queueRows(vr){
 const f=state.qfilter;let rows=vr.slice();
 if(f.lane!=="all")rows=rows.filter(r=>laneOf(r)===f.lane);
 if(f.reason!=="all")rows=rows.filter(r=>r.reasons.some(x=>x.code===f.reason));
 if(f.q){const q=f.q.toLowerCase();rows=rows.filter(r=>[r.id,r.customer,r.requester,r.approver,r.invoice,r.nature].some(v=>String(v).toLowerCase().includes(q)));}
 const k=state.qsort.key,d=state.qsort.dir;
 rows.sort((a,b)=>{let va=a[k],vb=b[k];if(k==="status"){va=statusOf(a);vb=statusOf(b);}if(typeof va==="string")return va.localeCompare(vb)*d;return ((va-vb)||(b.score-a.score))*d;});
 return rows;
}

function rulePerf(rows){
 return RC_ORDER.filter(c=>RC[c].type==="rule").map(c=>{
  const hit=rows.filter(r=>r.reasons.some(x=>x.code===c));
  const decided=hit.filter(r=>statusOf(r)!=="Open");
  const confirmed=hit.filter(r=>{const s=statusOf(r);return s==="Confirmed"||s==="Escalated";});
  const cleared=hit.filter(r=>statusOf(r)==="Cleared");
  return{code:c,n:hit.length,amount:sum(hit,r=>r.amount),decided:decided.length,confirmed:confirmed.length,cleared:cleared.length,precision:decided.length?confirmed.length/decided.length*100:null};
 }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
}
function ruleTuning(rows){
 /* Reading B, now driven by the DECISION each credit received (no separate assess step):
    a credit carrying a signal that was Confirmed/Escalated = the signal was a true positive (engine right);
    Cleared without the authorized flag = a false positive (engine over-fired, counts against accuracy);
    Cleared WITH the authorized flag = the signal was real but a sanctioned exception (does not count against). */
 const notes=[];
 const per=RC_ORDER.map(c=>{
  let t=0,over=0,auth=0;
  rows.forEach(r=>{
   if(!r.reasons.some(x=>x.code===c))return;
   const d=state.decisions[r.id];if(!d)return; /* only decided credits are labels */
   if(d.decision==="Confirmed"||d.decision==="Escalated")t++;
   else if(d.decision==="Cleared"&&d.authorized){auth++;if(d.note&&d.note.trim())notes.push({code:c,cm:r.id,customer:r.customer,note:d.note.trim()});}
   else if(d.decision==="Cleared")over++;
  });
  const assessed=t+over+auth;const acc=assessed?(t+auth)/(t+auth+over)*100:null;
  return{code:c,type:RC[c].type,assessed,t,over,auth,acc};
 }).filter(x=>x.assessed>0).sort((a,b)=>b.assessed-a.assessed);
 return{per,notes,total:sum(per,x=>x.assessed)};
}

 if(/(rule|control|paw|internal order|\bio\b|attachment|segregation|sod|approver)/.test(t)){const rs=reasonStats(rows).filter(s=>RC[s.code].type==="rule");if(!rs.length)return "No deterministic control rule fired in this scope.";return "Control hits (rule checks, not AI):\n"+rs.map(s=>"- "+RC[s.code].label+": "+s.n+" credits, "+money(s.amount)).join("\n");}

 return null;

function humanSize(b){if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(0)+" KB";return (b/1048576).toFixed(1)+" MB";}

 arr.forEach(function(f){var rec={id:"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name,size:f.size,type:f.type||"",text:""};

function caseNarrative(r){
 if(!r.reasons.length)return "No control rule or pattern fired for this credit. It is in the queue only because the window includes every posted credit.";
 const rules=r.reasons.filter(x=>RC[x.code].type==="rule"),pats=r.reasons.filter(x=>RC[x.code].type==="pattern");
 let s=r.id+" scored "+r.score+" out of 100. ";
 if(rules.length)s+="It fails "+rules.length+" control rule"+(rules.length>1?"s":"")+" that should have stopped it at the gate: "+rules.map(x=>x.evidence).join(" ")+" ";
 if(pats.length)s+="It also matches "+pats.length+" cross-transaction pattern"+(pats.length>1?"s":"")+": "+pats.map(x=>x.evidence).join(" ");
 return s.trim()+" Check the related credits and the supporting documents before deciding.";
}

/* Verification checklist, derived from the record. Items the reviewer ticks off before deciding. */
function caseChecklist(r){
 const items=[];
 items.push(["Supporting documents attached and legible",r.attProv>=r.attReq?"ok":"bad",r.attProv+" of "+r.attReq+" mandatory attachments on file"]);
 if(r.paw)items.push(["Promo approval valid and covers the posting date",(r.date>=r.paw.from&&r.date<=r.paw.to)?"ok":"bad",r.paw.id+" runs "+r.paw.from+" to "+r.paw.to+"; posted "+r.date]);
 items.push(["Internal Order open",r.io.status!=="Closed"?"ok":"bad",r.io.id+" is "+r.io.status]);
 items.push(["Amount within the approver's limit",r.amount<=r.limit?"ok":"bad",peso(r.amount)+" vs "+r.approver+" limit "+peso(r.limit)]);
 items.push(["Requestor and approver are different people",r.requester!==r.approver?"ok":"bad",r.requester===r.approver?r.requester+" is both":"requestor "+r.requester+", approver "+r.approver]);
 if(r.reasons.some(x=>x.code==="DUP"))items.push(["Not a duplicate of a related credit","bad","matches "+r.related.length+" related credit(s); confirm the invoice reference"]);
 if(r.reasons.some(x=>x.code==="SPLIT"))items.push(["Not part of a sub-limit cluster","bad","review the cluster under one combined approval"]);
 return items;
}

function openAbout(){
 const flow=(steps)=>`<div class="d-flex align-items-center gap-1 flex-wrap" style="margin:8px 0 4px">${steps.map((s,i)=>`<span class="flowstep"><span class="fs-box ${s[1]||""}">${esc(s[0])}</span>${i<steps.length-1?`<span class="text-muted2">\u2192</span>`:""}</span>`).join("")}</div>`;
 openModal(`<div class="ov-pad about"><div class="d-flex align-items-start justify-content-between mb-2"><div><div class="text-muted2" style="font-size:12px">Concept</div><h5 style="margin:0;font-weight:600">Fraud Master: a risk detection and prioritization layer for Credit Memos</h5></div><button class="btnx btn-ghost" data-action="close-modal" style="padding:4px">${IC.x}</button></div>
  <p>It identifies suspicious patterns in posted Credit Memos, explains why they are suspicious, and helps reviewers focus on the credits that deserve attention. It does not independently declare that fraud occurred.</p>
  <h6>The problem</h6>
  <p>FS controls for Credit Memos are strong: budget and promo approval pre-requisites, documentation rules, segregation of duties, weekly AR monitoring. Residual weaknesses remain in FS's own assessment: deduction splitting, soft-copy-only submissions, advance deductions, credits to the wrong IO or with inconsistent mechanics, manual RFCM creation, no duplicate checking, and an awareness gap. Each review looks at one credit at a time, which is exactly where splitting, near-duplicates, and frequency spikes hide.</p>
  <p>Reference, Jul 2025 to Jun 2026: General Trade received 82,078 credits (\u20b13.50B) and MT National Chains 29,382 (\u20b13.85B). General Trade intervention rate was 6.14% by count (5,037 instances) and 8.74% by amount. Those interventions are IO, details, and attachment exceptions, not fraud labels.</p>
  <h6>Where it fits</h6>
  ${flow([["Request (eRFCM)"],["Validation"],["Approval"],["Posting"],["Score & triage","fm"],["Work queue","fm"],["Decision","fm"]])}
  <p>The entry gate and posting gate <b>prevent</b>: embedded rules for promo approval, IO, mechanics, attachments, and approval limits (roadmap item 10). Fraud Master <b>detects</b>: it scores posted and historical credits in batch and sorts them into three lanes, Investigate, Review, and Straight-through, so a reviewer works the risk down top-first. Reviewers decide; the Controls screen shows what share would have been stopped at the gate.</p>
  <h6>Three layers</h6>
  <div class="row g-2 mb-1"><div class="col-12 col-md-4"><div class="layer"><div class="lt">1. Deterministic controls</div><div class="ld">Missing attachment, expired promo approval, closed IO, exceeded authority, requestor = approver, exact duplicate. Rules, not AI. They belong at the gate.</div></div></div><div class="col-12 col-md-4"><div class="layer"><div class="lt">2. Risk and anomaly analytics</div><div class="ld">Similar claims, deduction splitting, abnormal frequency, unusual amounts and timing, behavioral change per customer or requester. Cross-transaction, where one-at-a-time review is weakest.</div></div></div><div class="col-12 col-md-4"><div class="layer"><div class="lt">3. Investigation assistance</div><div class="ld">The three-lane work queue and the case panel: score, reason codes, evidence, a verification checklist, related credits, decision with note, and an optional plain-language explanation. This is the surface a reviewer actually works in.</div></div></div></div>
  <p class="text-muted2" style="font-size:12px">Principle: do not use AI for a check a reliable rule can express. Aligned to the existing three-layer detection design.</p>
  <h6>Priority use cases</h6>
  <ul><li><b>Now (POC 1):</b> duplicate, similar, or repeated claims; deduction splitting; unusual transactional behavior.</li><li><b>Conditional:</b> document anomalies, only if historical attachments are available, linked to their CM, and readable.</li><li><b>Deferred to Phase 2:</b> coordinated or collusive patterns (graph), which need customer master data, user IDs, approval histories, and bank or address data.</li></ul>
  <h6>POC hypothesis</h6>
  <p><b>Credit Memo Risk Scoring and Anomaly Detection POC.</b> Can historical Credit Memo data be used to identify and rank transactions with suspicious patterns more effectively than the current review approach? Historical batch extract of 12 to 24 months, read-only, masked; no live ERP integration in POC 1. Success criteria: detection effectiveness against known cases, review reduction, precision of the high-risk band, explainability of every flag, and whether an FS reviewer can act on the output without a data scientist. Humans make the final determination.</p>
  <h6>What this demo is</h6>
  <p>Mock credits generated in the browser with planted scenarios. Scoring is deterministic rules plus simple pattern analytics with illustrative weights; a real deployment would tune these thresholds. AI is used only to explain, summarize, and answer questions over the authorized rows. Nothing is stored. Same build family as Spend Master: one HTML file, a serverless proxy, no database.</p>
  <div class="d-flex justify-content-end mt-3"><button class="btnx btn-brand" data-action="close-modal">Close</button></div></div>`,true);
}

document.addEventListener("mouseover",e=>{const sp=e.target.closest&&e.target.closest(".segpart");if(!sp)return;segtip.innerHTML="<b>"+esc(sp.dataset.name)+"</b><br>"+esc(sp.dataset.val)+" \u00b7 "+esc(sp.dataset.pct);segtip.style.display="block";});
document.addEventListener("mousemove",e=>{if(segtip.style.display!=="block")return;const sp=e.target.closest&&e.target.closest(".segpart");if(!sp){segtip.style.display="none";return;}segtip.style.left=e.clientX+"px";segtip.style.top=(e.clientY-12)+"px";});
document.addEventListener("mouseout",e=>{const sp=e.target.closest&&e.target.closest(".segpart");if(sp)segtip.style.display="none";});
state.view="overview";
if(location.protocol==="http:"||location.protocol==="https:"){fetch("/api/health").then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&j.ok){BACKEND=true;AI.live=true;AI.provider=j.provider||"provider";AI.model=j.model||"";}}).catch(function(){});}
render();
</script>
</body>
</html>
