<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 668" width="1240" height="668" role="img" aria-labelledby="t"><title id="t">Fraud Master architecture</title><style>svg{--bg:#ffffff;--zone:#f5f6f8;--zoneStroke:#d5d9e0;--zoneLabel:#0a6fb8;--node:#ffffff;--nodeStroke:#c4cad3;--title:#111827;--text:#4b5563;--edge:#6b7280;--edgeText:#374151;--accent:#0a84d6;--pill:#ffffff;}@media (prefers-color-scheme: dark){svg{--bg:#0f1218;--zone:#151a23;--zoneStroke:#2a313d;--zoneLabel:#4db5ff;--node:#1b212c;--nodeStroke:#363e4c;--title:#f3f4f6;--text:#a4acb9;--edge:#8a93a2;--edgeText:#d1d5db;--accent:#4db5ff;--pill:#0f1218;}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.bg{fill:var(--bg)}
.zone{fill:var(--zone);stroke:var(--zoneStroke);stroke-width:1;stroke-dasharray:5 4}
.zlabel{fill:var(--zoneLabel);font-size:12px;font-weight:700;letter-spacing:.08em}
.zsub{fill:var(--text);font-size:12px}
.node{fill:var(--node);stroke:var(--nodeStroke);stroke-width:1.2}
.node.key{stroke:var(--accent);stroke-width:2}
.bar{fill:var(--accent)}
.ntitle{fill:var(--title);font-size:14px;font-weight:600}
.ntext{fill:var(--text);font-size:12px}
.edge{fill:none;stroke:var(--edge);stroke-width:1.5}
.edge.alt{stroke-dasharray:6 4}
.head{fill:var(--edge)}
.pill{fill:var(--pill);stroke:var(--zoneStroke);stroke-width:1}
.elabel{fill:var(--edgeText);font-size:11.5px}
.legend{fill:var(--text);font-size:12px}
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1240" height="668" rx="14"/><rect class="zone" x="16" y="16" width="1208" height="424" rx="12"/><text class="zlabel" x="36" y="46">BROWSER</text><text class="zsub" x="36" y="66">A single HTML file. Credit memos are generated in the page with planted fraud scenarios.</text><rect class="zone" x="16" y="464" width="1208" height="160" rx="12"/><text class="zlabel" x="36" y="494">OPTIONAL</text><text class="zsub" x="36" y="514">Only used when an AI proxy is configured. Scoring and routing never depend on it.</text><path class="edge" d="M288,147 L322.7,147 Q323,147 323,146.7 L323,146.7 Q323,146.4 323.3,146.4 L358,146.4" marker-end="url(#arrow)"/><path class="edge" d="M628,146.4 L662.7,146.4 Q663,146.4 663,146.7 L663,146.7 Q663,147 663.3,147 L698,147" marker-end="url(#arrow)"/><path class="edge" d="M813,184 L813,300" marker-end="url(#arrow)"/><path class="edge" d="M493,300 L493,201" marker-end="url(#arrow)"/><path class="edge" d="M288,337 L358,337" marker-end="url(#arrow)"/><path class="edge" d="M928,337 L988,337" marker-end="url(#arrow)"/><path class="edge" d="M1096,374 L1096,442 Q1096,452 1086,452 L1058,452 Q1048,452 1048,462 L1048,530" marker-end="url(#arrow)"/><rect class="node" x="48" y="110" width="240" height="74" rx="10"/><rect class="bar" x="48" y="122" width="3" height="50" rx="1.5"/><text class="ntitle" x="64" y="137">Seeded credit memos</text><text class="ntext" x="64" y="158">620 memos, 9 natures</text><text class="ntext" x="64" y="175">Planted fraud scenarios</text><rect class="node key" x="358" y="110" width="270" height="91" rx="10"/><text class="ntitle" x="374" y="137">Rules engine</text><text class="ntext" x="374" y="158">6 control rules: SoD, limits,</text><text class="ntext" x="374" y="175">promo approval, IO, documents</text><text class="ntext" x="374" y="192">6 patterns: duplicate, split...</text><rect class="node" x="698" y="110" width="230" height="74" rx="10"/><text class="ntitle" x="714" y="137">Routing</text><text class="ntext" x="714" y="158">Investigate, Review,</text><text class="ntext" x="714" y="175">or Straight-through</text><rect class="node" x="48" y="300" width="240" height="74" rx="10"/><text class="ntitle" x="64" y="327">Role views</text><text class="ntext" x="64" y="348">Reviewer, team lead,</text><text class="ntext" x="64" y="365">controls, internal audit</text><rect class="node" x="358" y="300" width="270" height="74" rx="10"/><text class="ntitle" x="374" y="327">Rules and tuning</text><text class="ntext" x="374" y="348">Weights, hard stops, on/off</text><text class="ntext" x="374" y="365">Export and import as JSON</text><rect class="node" x="698" y="300" width="230" height="74" rx="10"/><text class="ntitle" x="714" y="327">Work queue and case</text><text class="ntext" x="714" y="348">Checklist, related memos,</text><text class="ntext" x="714" y="365">decision with reason code</text><rect class="node" x="988" y="300" width="216" height="74" rx="10"/><text class="ntitle" x="1004" y="327">Local masking</text><text class="ntext" x="1004" y="348">Names swapped for aliases</text><text class="ntext" x="1004" y="365">before any AI call</text><rect class="node" x="808" y="530" width="300" height="74" rx="10"/><text class="ntitle" x="824" y="557">LLM proxy (/api/complete)</text><text class="ntext" x="824" y="578">Not part of this repo</text><text class="ntext" x="824" y="595">Answers are rehydrated locally</text><rect class="pill" x="283.4" y="137" width="44.2" height="20" rx="5"/><text class="elabel" x="305.5" y="151" text-anchor="middle">score</text><rect class="pill" x="623.4" y="129.4" width="44.2" height="34" rx="5"/><text class="elabel" x="645.5" y="143.4" text-anchor="middle">risk</text><text class="elabel" x="645.5" y="157.4" text-anchor="middle">score</text><rect class="pill" x="790.9" y="232" width="44.2" height="20" rx="5"/><text class="elabel" x="813" y="246" text-anchor="middle">cases</text><rect class="pill" x="464.46" y="240.5" width="57.080000000000005" height="20" rx="5"/><text class="elabel" x="493" y="254.5" text-anchor="middle">weights</text><rect class="pill" x="288.02" y="320" width="69.96000000000001" height="34" rx="5"/><text class="elabel" x="323" y="334" text-anchor="middle">controls</text><text class="elabel" x="323" y="348" text-anchor="middle">lead only</text><rect class="pill" x="929.46" y="320" width="57.080000000000005" height="34" rx="5"/><text class="elabel" x="958" y="334" text-anchor="middle">explain</text><text class="elabel" x="958" y="348" text-anchor="middle">case</text><rect class="pill" x="1067.46" y="396" width="57.080000000000005" height="34" rx="5"/><text class="elabel" x="1096" y="410" text-anchor="middle">masked</text><text class="elabel" x="1096" y="424" text-anchor="middle">context</text><path class="edge" d="M36,642 L70,642" marker-end="url(#arrow)"/><text class="legend" x="80" y="646">Call or request (responses return the same way)</text><rect class="node key" x="425.84000000000003" y="634" width="22" height="16" rx="4"/><text class="legend" x="455.84000000000003" y="646">Core logic</text><rect class="node" x="553.0400000000001" y="634" width="22" height="16" rx="4"/><rect class="bar" x="553.0400000000001" y="637" width="3" height="10" rx="1.5"/><text class="legend" x="583.0400000000001" y="646">Generated data</text></svg>
